<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b7a4a">
<title>Exercise Timer</title>
<style>
:root{color-scheme:light dark;--bg:#fafafa;--fg:#241f31;--muted:#5b5964;--card:#fff;--line:#d0d0d0;--ctl:#8a8a8a;--focus:#1c62c4;
--warm:#8f5a00;--train:#1b7a4a;--rest:#1c62c4;--between:#8035a0;--done:#5e5c64}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1e;--fg:#f6f5f4;--muted:#b8b6bb;--card:#2a2a2a;--line:#444;--ctl:#8a8a8a;--focus:#78aeed}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{width:100%;max-width:420px}
h1{font-size:1.2rem;text-align:center;margin:0 0 12px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#display{border-radius:20px;padding:24px 16px;text-align:center;color:#fff;background:var(--done);transition:background .3s}
#phase{font-size:1.5rem;font-weight:600}
#time{font-size:clamp(4rem,24vw,6rem);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#info,#next{min-height:1.4em}
#next{font-size:.9rem}
#bar{height:8px;background:rgba(255,255,255,.35);border-radius:4px;margin-top:12px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#fff}
.btns{display:flex;gap:8px;margin:14px 0}
button{flex:1;min-height:48px;padding:12px;border-radius:12px;font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--ctl);cursor:pointer;touch-action:manipulation}
button.primary{background:var(--train);color:#fff;border-color:var(--train);font-weight:600}
fieldset{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 14px;margin:0;min-width:0}
legend{padding:0 6px}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
input[type=checkbox]{flex:none;width:24px;height:24px;accent-color:var(--train)}
.hint{font-size:.85rem;color:var(--muted);padding:0 0 6px}
input[type=number]{flex:none;width:96px;min-height:44px;padding:8px;font-size:1rem;text-align:right;border-radius:8px;border:1px solid var(--ctl);background:var(--bg);color:var(--fg)}
input:disabled{opacity:.6}
.sum{text-align:center;color:var(--muted);font-size:.9rem;margin-top:8px}
.keys{text-align:center;color:var(--muted);font-size:.8rem;margin-top:4px}
kbd{font:inherit;border:1px solid var(--ctl);border-radius:4px;padding:0 .35em}
@media (prefers-reduced-motion:reduce){#display{transition:none}}
@media (max-width:360px){#phase{font-size:1.3rem}}
@media (orientation:landscape) and (max-height:520px){
  main{max-width:780px;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"h h" "d s" "b s" "u s" "k s";grid-template-rows:auto auto auto auto 1fr;column-gap:16px;align-items:start}
  h1{grid-area:h;margin-bottom:8px}#display{grid-area:d;padding:12px}.btns{grid-area:b;margin:10px 0 0}#settings{grid-area:s}.sum{grid-area:u}.keys{grid-area:k}
  #time{font-size:4.5rem}
}
</style>
</head>
<body>
<main>
<h1><span aria-hidden="true">🏋️</span> Exercise Timer</h1>
<div id="display" role="group" aria-label="計時顯示">
  <div id="phase">準備好了</div>
  <div id="time" role="timer" aria-label="本階段剩餘秒數">0</div>
  <div id="info"></div>
  <div id="next"></div>
  <div id="bar" role="progressbar" aria-label="本階段進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
</div>
<div id="sr" class="sr" role="status" aria-live="polite"></div>
<div class="btns">
  <button id="start" type="button" class="primary" aria-keyshortcuts="Space">開始</button>
  <button id="skip" type="button" aria-keyshortcuts="S">跳過</button>
  <button id="reset" type="button" aria-keyshortcuts="R">重設</button>
</div>
<fieldset id="settings">
  <legend>設定（時間單位：秒）</legend>
  <label>熱身 Warm up <input type="number" inputmode="numeric" min="0" max="3600" id="warm" value="10"></label>
  <label>訓練 Training <input type="number" inputmode="numeric" min="1" max="3600" id="train" value="40"></label>
  <label>休息 Rest <input type="number" inputmode="numeric" min="0" max="3600" id="rest" value="5"></label>
  <label>每輪動作數 Exercises / cycle <input type="number" inputmode="numeric" min="1" max="99" id="per" value="4"></label>
  <label>循環次數 Cycles <input type="number" inputmode="numeric" min="1" max="99" id="cycles" value="4"></label>
  <label>循環間休息 Between cycles <input type="number" inputmode="numeric" min="0" max="3600" id="between" value="30"></label>
  <label>與背景音樂混音 Mix with music <input type="checkbox" id="mix" checked aria-describedby="mixhint"></label>
  <div class="hint" id="mixhint">開：Spotify 等音樂不會被暫停，但靜音鍵開著會沒聲音。關：靜音也會響，但會暫停其他音樂。</div>
  <div class="hint" id="lockhint" hidden>計時進行中，設定已鎖定。按「重設」後可修改。</div>
</fieldset>
<div class="sum" id="sum"></div>
<div class="keys">快捷鍵 Shortcuts：<kbd>Space</kbd> 開始/暫停 · <kbd>S</kbd> 跳過 · <kbd>R</kbd> 重設</div>
</main>
<script src="timer-core.js"></script>
<script>
const {KEYS:keys,MAX_TOTAL,clampConfig,buildPlan,planTotal,beepList,wavBytes,fmtTime}=ETCore;
const $=id=>document.getElementById(id);
try{const m=localStorage.getItem('et-mix');if(m!=null)$('mix').checked=m==='1'}catch{}
function applySession(){try{if(navigator.audioSession)navigator.audioSession.type=$('mix').checked?'ambient':'playback'}catch{}}
$('mix').addEventListener('change',()=>{try{localStorage.setItem('et-mix',$('mix').checked?'1':'0')}catch{};applySession()});
const COLORS={warm:'--warm',train:'--train',rest:'--rest',between:'--between',done:'--done'};
const LABELS={warm:'熱身',train:'訓練',rest:'休息',between:'循環間休息',done:'完成 🎉'};
try{const s=JSON.parse(localStorage.getItem('et')||'{}');keys.forEach(k=>{if(s[k]!=null)$(k).value=s[k]})}catch{}
const cfg=()=>clampConfig(Object.fromEntries(keys.map(k=>[k,$(k).value])));


/* ---- Sound: the whole workout is rendered into one audio file and played by an
   <audio> element, so beeps keep coming with the screen off (JS timers are frozen
   then, but media playback is not). The wall clock is the source of truth; the
   audio is re-synced to it whenever it drifts or was interrupted by another app. */
const renderAudio=(p,t)=>new Blob([wavBytes(p,t)],{type:'audio/wav'});
const audio=new Audio();audio.preload='auto';audio.setAttribute('playsinline','');
let url=null,lastTry=0;
function playAt(e){
  try{if(audio.readyState>0&&Math.abs(audio.currentTime-e)>.3)audio.currentTime=e}catch{}
  const p=audio.play();if(p&&p.catch)p.catch(()=>{});
}
audio.addEventListener('loadedmetadata',()=>{if(running&&engine==='media')try{audio.currentTime=elapsed()}catch{}});

/* Mix mode: Web Audio oscillators scheduled ahead on the AudioContext clock.
   iOS treats Web Audio as ambient sound, so it mixes with Spotify etc.
   (works in Chrome too, where navigator.audioSession is missing). */
let ac=null,nodes=[],anchor=null,beeps=[],engine='media';
function waStop(){nodes.forEach(o=>{try{o.stop()}catch{}});nodes=[]}
function waSchedule(e){
  waStop();
  const t=ac.currentTime+.05;anchor={c:t,e};
  for(const b of beeps){
    const end=b.at+b.ms/1000;if(end-e<.03)continue;
    const st=t+Math.max(0,b.at-e),du=end-Math.max(b.at,e);
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='square';o.frequency.value=b.f;
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.5,st+.005);
    g.gain.setValueAtTime(.5,st+du-.01);g.gain.linearRampToValueAtTime(0,st+du);
    o.connect(g);g.connect(ac.destination);o.start(st);o.stop(st+du+.02);nodes.push(o);
  }
}
function soundPlay(e){
  if(engine==='wa'){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state!=='running')ac.resume().then(()=>{if(running)waSchedule(elapsed())}).catch(()=>{});
      waSchedule(e);
    }catch{}
  }else{
    if(!url){url=URL.createObjectURL(renderAudio(plan,total));audio.src=url}
    playAt(e);
  }
}
function soundStop(){audio.pause();waStop()}
function soundSync(e){
  if(engine==='wa'){
    if(!ac)return;
    if(ac.state!=='running'){if(!document.hidden&&Date.now()-lastTry>1500){lastTry=Date.now();ac.resume().then(()=>{if(running)waSchedule(elapsed())}).catch(()=>{})}}
    else if(anchor&&Math.abs((ac.currentTime-anchor.c)-(e-anchor.e))>.3)waSchedule(e);
    return;
  }
  if(!audio.paused){
    try{if(audio.readyState>0&&Math.abs(audio.currentTime-e)>.5)audio.currentTime=e}catch{}
  }else if(!document.hidden&&Date.now()-lastTry>1500){lastTry=Date.now();playAt(e)} // interrupted by another app → resume
}

/* ---- State ---- */
let plan=[],pc=null,total=0,base=0,t0=0,running=false,timer=null,wake=null,lastIdx=-1;
const now=()=>Date.now()/1000;
const elapsed=()=>running?base+now()-t0:base;
const segAt=e=>ETCore.segAt(plan,e);

function updateSum(){
  const c=cfg();const tot=planTotal(buildPlan(c));
  $('sum').textContent=tot>MAX_TOTAL?'總時間超過上限 3 小時，請縮短設定':`總時間 ${Math.floor(tot/60)}分${tot%60}秒`;
  try{localStorage.setItem('et',JSON.stringify(c))}catch{}
}
function setMeta(title){
  try{if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title,artist:'Exercise Timer'})}catch{}
}
const say=t=>{$('sr').textContent=t}; // polite live region: phase changes only, never per-second ticks
function setBar(pct){$('bar').querySelector('i').style.width=pct+'%';$('bar').setAttribute('aria-valuenow',Math.round(pct))}
function show(){
  const disp=$('display');
  if(!plan.length){disp.style.background=`var(${COLORS.done})`;$('phase').textContent='準備好了';$('time').textContent='0';$('info').textContent='';setBar(0);return}
  const e=elapsed(),i=segAt(e);
  if(i>=plan.length){disp.style.background=`var(${COLORS.done})`;$('phase').textContent=LABELS.done;$('time').textContent='0';$('info').textContent='';setBar(100);
    if(lastIdx!==i){lastIdx=i;setMeta(LABELS.done);say(LABELS.done.replace(' 🎉','')+'，辛苦了')}return}
  const s=plan[i],c=pc,left=Math.max(1,Math.ceil(s.s+s.d-e-1e-6));
  disp.style.background=`var(${COLORS[s.t]})`;
  $('phase').textContent=LABELS[s.t];
  $('time').textContent=left;
  const info=s.i?`循環 ${s.i}/${c.cycles}`+(c.per>1&&s.j?` · 動作 ${s.j}/${c.per}`:''):'';
  $('info').textContent=info;
  setBar(100*(s.d-left)/s.d);
  if(lastIdx!==i){lastIdx=i;setMeta(LABELS[s.t]+(info?' · '+info:''));say(LABELS[s.t]+(info?'，'+info:'')+`，${s.d} 秒`)}
}
function loop(){
  if(!running)return;
  const e=elapsed();
  if(e>=total){finish();return}
  soundSync(e);
  show();
}
let wakeBusy=false;
async function keepAwake(){
  if(!running||wake||wakeBusy)return;
  wakeBusy=true;
  try{
    const w=await navigator.wakeLock?.request('screen');
    if(!w)return;
    if(!running){w.release().catch(()=>{});return} // paused/reset while the request was pending
    wake=w;w.addEventListener('release',()=>{if(wake===w)wake=null});
  }catch{}finally{wakeBusy=false}
}
function freeAwake(){try{wake?.release()}catch{};wake=null}
function lockInputs(on){keys.forEach(k=>$(k).disabled=on);$('lockhint').hidden=!on}
const setMixLock=on=>{$('mix').disabled=on};

function start(){
  if(running){pause();return}
  applySession();
  if(!plan.length||base>=total){
    const c=cfg(),np=buildPlan(c),nt=planTotal(np);
    if(!np.length||nt>MAX_TOTAL)return;
    plan=np;pc=c;total=nt;base=0;lastIdx=-1;
    if(url)URL.revokeObjectURL(url);
    url=null;beeps=beepList(plan,total);
  }
  const want=$('mix').checked?'wa':'media';
  if(want!==engine){soundStop();engine=want}
  running=true;t0=now();
  soundPlay(base); // must run inside the tap so iOS allows playback
  $('start').textContent='暫停';lockInputs(true);setMixLock(true);
  clearInterval(timer);timer=setInterval(loop,250);
  keepAwake();show();
}
function pause(){
  base=elapsed();running=false;
  clearInterval(timer);soundStop();setMixLock(false);freeAwake(); // settings stay locked until reset/finish
  $('start').textContent='繼續';show();say('已暫停');
}
function finish(){
  base=total;running=false;clearInterval(timer);lockInputs(false);setMixLock(false);freeAwake();
  $('start').textContent='開始';show(); // audio plays out the final beep on its own
}
function skip(){
  if(!plan.length)return;
  const i=segAt(elapsed());if(i>=plan.length)return;
  const e=plan[i].s+plan[i].d;
  base=e;t0=now();
  if(running)soundPlay(Math.min(e,total));
  if(e>=total){finish();return}
  show();
}
function reset(){
  running=false;clearInterval(timer);soundStop();lockInputs(false);setMixLock(false);freeAwake();
  if(url){audio.removeAttribute('src');URL.revokeObjectURL(url);url=null}
  plan=[];pc=null;total=0;base=0;lastIdx=-1;$('start').textContent='開始';updateSum();show();
}
/* Keyboard shortcuts (ignored while typing in a field or when a control already handles the key) */
document.addEventListener('keydown',ev=>{
  if(ev.ctrlKey||ev.metaKey||ev.altKey||ev.repeat)return;
  const tag=ev.target.tagName,k=ev.key.toLowerCase();
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(k===' '||ev.code==='Space'){if(tag==='BUTTON'||tag==='A')return;ev.preventDefault();start()}
  else if(k==='s')skip();
  else if(k==='r'&&!running)reset(); // not while running: avoid losing a workout to a stray key
});
$('start').onclick=start;
$('skip').onclick=skip;
$('reset').onclick=reset;
keys.forEach(k=>$(k).addEventListener('input',updateSum));
const back=()=>{if(!document.hidden&&running){keepAwake();loop()}};
document.addEventListener('visibilitychange',back);
window.addEventListener('pageshow',back);
window.addEventListener('focus',back);
try{
  navigator.mediaSession.setActionHandler('play',()=>{if(!running)start()});
  navigator.mediaSession.setActionHandler('pause',()=>{if(running)pause()});
}catch{}
updateSum();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
