<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#26a269">
<title>Exercise Timer</title>
<style>
:root{--bg:#fafafa;--fg:#241f31;--card:#fff;--line:#d0d0d0;--warm:#e5a50a;--train:#26a269;--rest:#1c71d8;--between:#9141ac;--done:#5e5c64}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1e;--fg:#f6f5f4;--card:#2a2a2a;--line:#444}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{width:100%;max-width:420px}
h1{font-size:1.2rem;text-align:center;margin:0 0 12px}
#display{border-radius:20px;padding:24px 16px;text-align:center;color:#fff;background:var(--done);transition:background .3s}
#phase{font-size:1.5rem;font-weight:600}
#time{font-size:6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#info{opacity:.9}
#bar{height:8px;background:rgba(255,255,255,.3);border-radius:4px;margin-top:12px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#fff}
.btns{display:flex;gap:8px;margin:14px 0}
button{flex:1;padding:14px;border:0;border-radius:12px;font-size:1rem;background:var(--card);color:var(--fg);border:1px solid var(--line);cursor:pointer}
button.primary{background:var(--train);color:#fff;border:0}
fieldset{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 14px}
legend{padding:0 6px}
label{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--train)}
.hint{font-size:.8rem;opacity:.65;padding:0 0 6px}
input[type=number]{width:90px;padding:8px;font-size:1rem;text-align:right;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.sum{text-align:center;opacity:.7;font-size:.9rem;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>🏋️ Exercise Timer</h1>
<div id="display">
  <div id="phase">準備好了</div>
  <div id="time">0</div>
  <div id="info"></div>
  <div id="bar"><i></i></div>
</div>
<div class="btns">
  <button id="start" class="primary">開始</button>
  <button id="skip">跳過</button>
  <button id="reset">重設</button>
</div>
<fieldset id="settings">
  <legend>設定(秒)</legend>
  <label>熱身 Warm up <input type="number" min="0" id="warm" value="10"></label>
  <label>訓練 Training <input type="number" min="1" id="train" value="40"></label>
  <label>休息 Rest <input type="number" min="0" id="rest" value="5"></label>
  <label>每輪動作數 Exercises / cycle <input type="number" min="1" id="per" value="4"></label>
  <label>循環次數 Cycles <input type="number" min="1" id="cycles" value="4"></label>
  <label>循環間休息 Between cycles <input type="number" min="0" id="between" value="30"></label>
  <label>與背景音樂混音 Mix with music <input type="checkbox" id="mix" checked></label>
  <div class="hint">開：Spotify 等音樂不會被暫停，但靜音鍵開著會沒聲音。關：靜音也會響，但會暫停其他音樂。</div>
</fieldset>
<div class="sum" id="sum"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const keys=['warm','train','rest','per','cycles','between'];
try{const m=localStorage.getItem('et-mix');if(m!=null)$('mix').checked=m==='1'}catch{}
function applySession(){try{if(navigator.audioSession)navigator.audioSession.type=$('mix').checked?'ambient':'playback'}catch{}}
$('mix').addEventListener('change',()=>{try{localStorage.setItem('et-mix',$('mix').checked?'1':'0')}catch{};applySession()});
const COLORS={warm:'--warm',train:'--train',rest:'--rest',between:'--between',done:'--done'};
const LABELS={warm:'熱身',train:'訓練',rest:'休息',between:'循環間休息',done:'完成 🎉'};
try{const s=JSON.parse(localStorage.getItem('et')||'{}');keys.forEach(k=>{if(s[k]!=null)$(k).value=s[k]})}catch{}
const cfg=()=>Object.fromEntries(keys.map(k=>[k,Math.max(0,parseInt($(k).value)||0)]));

function buildPlan(c){
  const p=[];
  if(c.warm)p.push({t:'warm',d:c.warm});
  for(let i=1;i<=c.cycles;i++){
    for(let j=1;j<=c.per;j++){
      p.push({t:'train',d:c.train,i,j});
      const final=i===c.cycles&&j===c.per;
      if(!final&&c.rest)p.push({t:'rest',d:c.rest,i,j});
    }
    if(i<c.cycles&&c.between)p.push({t:'between',d:c.between,i});
  }
  let t=0;p.forEach(x=>{x.s=t;t+=x.d});
  return p;
}

/* ---- Sound: the whole workout is rendered into one audio file and played by an
   <audio> element, so beeps keep coming with the screen off (JS timers are frozen
   then, but media playback is not). The wall clock is the source of truth; the
   audio is re-synced to it whenever it drifts or was interrupted by another app. */
function beepList(p,tot){
  const L=[];
  p.forEach(x=>{
    const tr=x.t==='train',th=(tr||x.t==='rest')?5:3;
    L.push({at:x.s,f:tr?1600:600,ms:300});
    for(let left=Math.min(th,x.d-1);left>=1;left--)
      L.push({at:x.s+x.d-left,f:tr?(left===1?2200:1500):(left===1?1000:700),ms:left===1?250:120});
  });
  L.push({at:tot,f:1200,ms:600});
  return L;
}
const SR=8000;
function renderAudio(p,tot){
  const n=Math.ceil((tot+1.5)*SR),pcm=new Int16Array(n);
  const tone=(at,f,ms)=>{
    const a=Math.round(at*SR),len=Math.round(ms/1000*SR),h=3*f<SR/2,w=2*Math.PI*f/SR;
    for(let k=0;k<len&&a+k<n;k++){
      const env=Math.min(1,k/40,(len-k)/40);
      let v=Math.sin(w*k);if(h)v=(v+.35*Math.sin(3*w*k))/1.2;
      pcm[a+k]=v*env*30000;
    }
  };
  beepList(p,tot).forEach(b=>tone(b.at,b.f,b.ms));
  const buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,pcm[i],true);
  return new Blob([buf],{type:'audio/wav'});
}
const audio=new Audio();audio.preload='auto';audio.setAttribute('playsinline','');
let url=null,lastTry=0;
function playAt(e){
  try{if(audio.readyState>0&&Math.abs(audio.currentTime-e)>.3)audio.currentTime=e}catch{}
  const p=audio.play();if(p&&p.catch)p.catch(()=>{});
}
audio.addEventListener('loadedmetadata',()=>{if(running&&engine==='media')try{audio.currentTime=elapsed()}catch{}});

/* Mix mode: Web Audio oscillators scheduled ahead on the AudioContext clock.
   iOS treats Web Audio as ambient sound, so it mixes with Spotify etc.
   (works in Chrome too, where navigator.audioSession is missing). */
let ac=null,nodes=[],anchor=null,beeps=[],engine='media';
function waStop(){nodes.forEach(o=>{try{o.stop()}catch{}});nodes=[]}
function waSchedule(e){
  waStop();
  const t=ac.currentTime+.05;anchor={c:t,e};
  for(const b of beeps){
    const end=b.at+b.ms/1000;if(end-e<.03)continue;
    const st=t+Math.max(0,b.at-e),du=end-Math.max(b.at,e);
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='square';o.frequency.value=b.f;
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.5,st+.005);
    g.gain.setValueAtTime(.5,st+du-.01);g.gain.linearRampToValueAtTime(0,st+du);
    o.connect(g);g.connect(ac.destination);o.start(st);o.stop(st+du+.02);nodes.push(o);
  }
}
function soundPlay(e){
  if(engine==='wa'){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state!=='running')ac.resume().then(()=>{if(running)waSchedule(elapsed())}).catch(()=>{});
      waSchedule(e);
    }catch{}
  }else{
    if(!url){url=URL.createObjectURL(renderAudio(plan,total));audio.src=url}
    playAt(e);
  }
}
function soundStop(){audio.pause();waStop()}
function soundSync(e){
  if(engine==='wa'){
    if(!ac)return;
    if(ac.state!=='running'){if(!document.hidden&&Date.now()-lastTry>1500){lastTry=Date.now();ac.resume().then(()=>{if(running)waSchedule(elapsed())}).catch(()=>{})}}
    else if(anchor&&Math.abs((ac.currentTime-anchor.c)-(e-anchor.e))>.3)waSchedule(e);
    return;
  }
  if(!audio.paused){
    try{if(audio.readyState>0&&Math.abs(audio.currentTime-e)>.5)audio.currentTime=e}catch{}
  }else if(!document.hidden&&Date.now()-lastTry>1500){lastTry=Date.now();playAt(e)} // interrupted by another app → resume
}

/* ---- State ---- */
let plan=[],total=0,base=0,t0=0,running=false,timer=null,wake=null,lastIdx=-1;
const now=()=>Date.now()/1000;
const elapsed=()=>running?base+now()-t0:base;
const segAt=e=>{for(let i=0;i<plan.length;i++)if(e<plan[i].s+plan[i].d)return i;return plan.length};

function updateSum(){
  const c=cfg();const tot=buildPlan(c).reduce((a,s)=>a+s.d,0);
  $('sum').textContent=`總時間 ${Math.floor(tot/60)}分${tot%60}秒`;
  try{localStorage.setItem('et',JSON.stringify(c))}catch{}
}
function setMeta(title){
  try{if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title,artist:'Exercise Timer'})}catch{}
}
function show(){
  const disp=$('display'),bar=disp.querySelector('#bar i');
  if(!plan.length){disp.style.background=`var(${COLORS.done})`;$('phase').textContent='準備好了';$('time').textContent='0';$('info').textContent='';bar.style.width='0';return}
  const e=elapsed(),i=segAt(e);
  if(i>=plan.length){disp.style.background=`var(${COLORS.done})`;$('phase').textContent=LABELS.done;$('time').textContent='0';$('info').textContent='';bar.style.width='100%';
    if(lastIdx!==i){lastIdx=i;setMeta(LABELS.done)}return}
  const s=plan[i],c=cfg(),left=Math.max(1,Math.ceil(s.s+s.d-e-1e-6));
  disp.style.background=`var(${COLORS[s.t]})`;
  $('phase').textContent=LABELS[s.t];
  $('time').textContent=left;
  const info=s.i?`循環 ${s.i}/${c.cycles}`+(c.per>1&&s.j?` · 動作 ${s.j}/${c.per}`:''):'';
  $('info').textContent=info;
  bar.style.width=(100*(s.d-left)/s.d)+'%';
  if(lastIdx!==i){lastIdx=i;setMeta(LABELS[s.t]+(info?' · '+info:''))}
}
function loop(){
  if(!running)return;
  const e=elapsed();
  if(e>=total){finish();return}
  soundSync(e);
  show();
}
async function keepAwake(){try{if(running&&!wake)wake=await navigator.wakeLock?.request('screen');wake?.addEventListener?.('release',()=>{wake=null})}catch{}}
function freeAwake(){try{wake?.release()}catch{};wake=null}
function lockInputs(on){keys.forEach(k=>$(k).disabled=on)}

function start(){
  if(running){pause();return}
  applySession();
  if(!plan.length||base>=total){
    plan=buildPlan(cfg());if(!plan.length)return;
    total=plan.reduce((a,s)=>a+s.d,0);base=0;lastIdx=-1;
    if(url)URL.revokeObjectURL(url);
    url=null;beeps=beepList(plan,total);
  }
  const want=$('mix').checked?'wa':'media';
  if(want!==engine){soundStop();engine=want}
  running=true;t0=now();
  soundPlay(base); // must run inside the tap so iOS allows playback
  $('start').textContent='暫停';lockInputs(true);
  clearInterval(timer);timer=setInterval(loop,250);
  keepAwake();show();
}
function pause(){
  base=elapsed();running=false;
  clearInterval(timer);soundStop();lockInputs(false);freeAwake();
  $('start').textContent='繼續';show();
}
function finish(){
  base=total;running=false;clearInterval(timer);lockInputs(false);freeAwake();
  $('start').textContent='開始';show(); // audio plays out the final beep on its own
}
function skip(){
  if(!plan.length)return;
  const i=segAt(elapsed());if(i>=plan.length)return;
  const e=plan[i].s+plan[i].d;
  base=e;t0=now();
  if(running){soundPlay(Math.min(e,total));if(e>=total){finish();return}}
  show();
}
function reset(){
  running=false;clearInterval(timer);soundStop();lockInputs(false);freeAwake();
  plan=[];total=0;base=0;lastIdx=-1;$('start').textContent='開始';updateSum();show();
}
$('start').onclick=start;
$('skip').onclick=skip;
$('reset').onclick=reset;
keys.forEach(k=>$(k).addEventListener('input',updateSum));
const back=()=>{if(!document.hidden&&running){keepAwake();loop()}};
document.addEventListener('visibilitychange',back);
window.addEventListener('pageshow',back);
window.addEventListener('focus',back);
try{
  navigator.mediaSession.setActionHandler('play',()=>{if(!running)start()});
  navigator.mediaSession.setActionHandler('pause',()=>{if(running)pause()});
}catch{}
updateSum();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
